name: flutter_live_beauty
description: "A production-grade, open-source real-time live-streaming beauty filter and face enhancement SDK for Flutter with zero paid third-party dependencies."
version: 1.0.0
homepage: https://github.com/livebeauty/flutter_live_beauty
repository: https://github.com/livebeauty/flutter_live_beauty
issue_tracker: https://github.com/livebeauty/flutter_live_beauty/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.livebeauty.sdk.flutter_live_beauty
        pluginClass: FlutterLiveBeautyPlugin
      ios:
        pluginClass: FlutterLiveBeautyPlugin
